[workspace]
resolver = "2"
members = [
    "crates/algovoi-rfc9421-verifier",
    "crates/algovoi-rfc9421-ecdsa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AlgoVoi <chopmob@gmail.com>"]
rust-version = "1.74"

[workspace.dependencies]
thiserror = "1"
base64 = "0.22"
regex = "1"
num-bigint = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
p256 = "0.13"
p384 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
